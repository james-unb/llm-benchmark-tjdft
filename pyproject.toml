[project]
name = "llm-benchmark-tjdft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
    "pymupdf-layout>=2.1",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
benchmark = "src.teste_modelo_aut:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
